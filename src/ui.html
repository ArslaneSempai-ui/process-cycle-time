<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Eleven days, and nobody worked on it for nine</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23fbfaf7'/%3E%3Crect x='2' y='4' width='12' height='1' fill='%23111'/%3E%3Crect x='2' y='7' width='12' height='1' fill='%23111'/%3E%3Crect x='2' y='11' width='12' height='2' fill='%23111'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/registre.css" />
</head>
<body>
<main>
  <div class="haut">
    <div><h1 id="h1"></h1><p class="lede" id="lede"></p></div>
  </div>

  <div class="chiffres" id="tete"></div>
  <div id="alerte"></div>

  <h2 id="titrePromesse"></h2>
  <div id="promesse"></div>

  <h2 id="titreCohortes"></h2>
  <div id="cohortes"></div>

  <h2 id="titreRoutes"></h2>
  <div id="routes"></div>

  <h2 id="titreEtapes"></h2>
  <div id="etapes"></div>

  <h2 id="titreHyp"></h2>
  <div id="hypotheses"></div>

  <p class="renvoi" id="provenanceLegende"></p>
</main>

<script type="module">
import { barres, empile, partEcrite, saisir, strates } from "/graphes.js";
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

/*
 * One screen, two hosts.
 *
 * Locally this talks to the Node server; published there is none, and `window.LOCAL`
 * answers the same routes with the same shapes. One file rather than two means the hosted
 * demo cannot drift from the tool.
 */
/*
 * Attendre que le shim soit posé, quand il y en a un.
 *
 * Sur l'hôte statique, le shim est un module qui importe six fichiers ; l'écran n'en
 * importe qu'un. Si un seul de ces six tarde ou échoue, l'écran part avant lui, `api()`
 * tombe sur `fetch("/api/...")`, GitHub répond sa page 404 en HTML, et le lecteur reçoit
 * « Unexpected token '<' » avec un écran vide. Vu une fois sur cinq chargements de la
 * démo du banc, donc invisible pour qui vérifie une seule fois.
 *
 * Une balise classique posée avant les modules crée la promesse ; le shim la tient. En
 * local, `window.LOCAL_PRET` n'existe pas et rien n'attend.
 */
const pret = async () => { if (!window.LOCAL && window.LOCAL_PRET) await window.LOCAL_PRET; };

const api = async (chemin, corps) => {
  await pret();
  return window.LOCAL ? window.LOCAL(chemin, corps)
    : (await fetch(chemin, corps
        ? { method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(corps) } : {})).json();
};

/* The engine builds no sentences: it returns structures and the screen phrases them. */
const T = {
    h1: "Eleven days, and nobody worked on it for nine",
    lede: "A process report gives you an average and a time per step. Both are true and neither says what to do.",

    releve: "The process, measured",
    moyenne: "mean end to end", mediane: "median", p90: "90th percentile",
    travail: "time actually worked", attente: "share nobody was touching it",
    jours: "days", heures: "h",

    alerte: (moy, propre, sale) => `<b>The mean describes no case.</b> It is ${moy} days. Cases that never came back finish in ${propre}; cases that came back twice take ${sale}. A target set on the mean is met by every case that never had a problem.`,

    titreCohortes: "The two populations inside the average",
    colCohorte: "", colDossiers: "cases", colPart: "share", colMoyJours: "mean (d)",
    colMedJours: "median", colTravaille: "worked", colFois: "× a clean case",
    cohortesQuoi: "What separates the two is neither the size of the file nor the diligence of the analyst: it is <b>whether the case came back</b>.",

    voirChiffres: "Show every figure",
    repere: (m) => `The vertical mark is the headline mean, <b>${m} days</b>. Not one of the three bars lands on it.`,
    titreRoutes: "The routes actually taken",
    routesQuoi: (n, conf, quatre) => `The procedure describes one route. <b>${conf} of cases followed it exactly.</b> There are ${n} distinct routes, and it takes ${quatre} of them to cover four fifths of the cases.`,
    colCas: "cases", colRoute: "route", documente: "documented",
    plusDeRoutes: (n) => `${n} further routes below these.`,

    titreEtapes: "What a step report misses",
    etapesQuoi: "A step average divides minutes by <b>occurrences</b>, not by cases.",
    figAttenteTitre: "One average case, hour by hour",
    figAttenteAria: "A single bar: hands-on work takes a thin segment on the left, waiting takes all the rest.",
    figEtapesTitre: "Where the case waits, step by step",
    figEtapesAria: "Bars of the median wait before each step; the time actually worked is noted under each bar.",
    figCarteTitre: "The path actually taken",
    figCarteAria: "Process map: the documented route crosses the figure in a straight line and the departures hang below it — including two loops, one returning to the documents after a request for more information, the other going back through risk assessment after an escalation.",
    figCarteLegende: (p) => `The eight most frequent routes, ${p} of cases. Line thickness: number of cases.`,
    figRoutesTitre: "The routes actually followed",
    figRoutesAria: "Bars of the share of cases per route; the documented route leads, and the tail of remaining routes weighs more than all the others together.",
    figDelaiTitre: "What pricing the delay changes",
    figDelaiAria: "Two bars: the annual value with delay priced in, and the same without, a factor of several times.",
    segTravail: "worked", segAttente: "waiting",
    figAttenteNom: (n) => `mean over ${n} cases`,
    autresRoutes: (n) => `the ${n} other routes`,
    avecDelai: "delay priced", sansDelai: "delay at zero",
    travailleSous: (m) => `${m} min worked`,
    colActivite: "activity", colParDossier: "times / case", colRapport: "a report says",
    colReel: "costs per case", colAttenteAvant: "median wait before",

    titrePromesse: "The promise you can actually keep",
    figPromesseTitre: "Every case, by how many times it came back",
    figPromesseAria: "Three strata of cases on one axis of lead time — never returned, returned once, returned twice or more. A limit line the reader drags cuts each stratum, and the share of cases finishing inside the promise is written at the right of each.",
    promesseEtiq: (j) => `promise: ${j} days`,
    promesseQuoi: (propre, pire, tout) => `Drag the line. At this promise it is kept for <b>${propre}</b> of the cases that never came back and <b>${pire}</b> of those that came back twice — ${tout} overall. A service level set on the average is met by the population that never had a problem in the first place.`,

    titreHyp: "The assumptions",
    hypQuoi: "The event log is measured. What turns it into a decision is not — and the least knowable figure is the one that decides.",
    loadedHourlyCost: "Loaded cost of an analyst hour ($)",
    casesPerYear: "Cases per year",
    costPerDayOfDelay: "Cost of one day of delay, per case ($)",
    valeur: "Removing all the rework would be worth, a year",
    zero: (v, base, f) => `At zero — which is what happens when nobody can name the figure — the same work is worth ${v} rather than ${base}. <b>A factor of ${f}</b>, and the difference between a project that gets funded and one that does not.`,
    defaut: "Reset the assumptions",

    provenance: "Every figure on this page is <b>measured</b> from the event log, <b>assumed</b> because nobody here can know it, or <b>chosen</b> by me. None is retrieved from a public source. The README says which is which, one by one.",
};

/* La journée ouvrée du modèle : 480 minutes, soit huit heures. Le tableau des étapes
 * divise déjà par 480 pour afficher des jours ; les figures utilisent la même. */
const JOUR_MIN = 480, JOUR = 8;

const t = () => T;
let etat = null, occupe = false;

const nb = (n) => Math.round(n).toLocaleString("en-GB");
const dollars = (n) => "$" + nb(n);

/*
 * A number typed by a human, read tolerantly.
 *
 * `<input type="number">` renders its value through the browser's locale, so 2.4 appeared
 * as "2,4" on an English page — a visible inconsistency on a screen whose whole argument is
 * that its figures are trustworthy. These are text fields now, and both separators are
 * accepted because both are what people type.
 */
const lire = (v) => Number(String(v).replace(/\s/g, "").replace(",", "."));
const pc = (x) => (x * 100).toFixed(1) + " %";

function blocTete() {
  const L = t(), o = etat.overall;
  const ligne = (k, v) => `<div class="ligne"><span class="intitule">${esc(k)}</span><span class="valeur">${v}</span></div>`;
  $("#tete").innerHTML = `<section class="feuillet">
    <div class="titre">${esc(L.releve)}</div>
    ${ligne(L.moyenne, o.meanLeadDays.toFixed(1) + " " + L.jours)}
    ${ligne(L.mediane, o.medianLeadDays.toFixed(1))}
    ${ligne(L.p90, o.p90LeadDays.toFixed(1))}
    ${ligne(L.travail, o.meanTouchHours.toFixed(1) + " " + L.heures)}
    <div class="ligne total"><span class="intitule">${esc(L.attente)}</span>
      <span class="valeur">${pc(o.waitingShare)}</span></div>
    <div class="titre-fig">${esc(L.figAttenteTitre)}</div>
    ${empile({
      items: [{ nom: L.figAttenteNom(nb(o.cases)), parts: [
        { nom: L.segTravail, valeur: o.meanTouchHours, ton: "accent" },
        { nom: L.segAttente, valeur: JOUR * o.meanLeadDays - o.meanTouchHours, ton: "neutre" },
      ] }],
      fmt: (v) => v.toFixed(1) + " " + L.heures,
      aria: L.figAttenteAria,
    })}
  </section>`;
}

function blocAlerte() {
  const L = t(), c = etat.cohorts, o = etat.overall;
  const propre = c.find((x) => x.passes === 0), sale = c[c.length - 1];
  $("#alerte").innerHTML = `<div class="renvoi attention">${L.alerte(
    o.meanLeadDays.toFixed(1), propre.meanLeadDays.toFixed(1) + " " + L.jours,
    sale.meanLeadDays.toFixed(1))}</div>`;
}

/**
 * LA PROMESSE.
 *
 * Le reste de l'écran démontre que la moyenne ne décrit personne. Le démontrer ne sert à
 * rien si le lecteur ne peut pas s'en servir : ce qu'il a, lui, c'est un délai promis. Il
 * le tire le long de l'axe et lit, strate par strate, à qui sa promesse s'adresse
 * réellement — les dossiers jamais revenus la tiennent tous, ceux qui sont revenus ne la
 * tiennent presque jamais. Aucune moyenne n'apparaît dans la figure ; c'est le propos.
 *
 * Le bloc se redessine seul pendant le geste. Rien d'autre sur la page ne dépend de la
 * promesse, et refaire un aller-retour réseau par mouvement du doigt saccaderait ; le
 * serveur est prévenu à la fin du geste, pour que la valeur survive à un rechargement.
 */
let syncPromesse = 0;
function blocPromesse() {
  const L = t(), p = etat.promesse;
  $("#titrePromesse").textContent = L.titrePromesse;

  const liste = etat.strates.map((x) => ({ nom: x.nom, valeurs: x.jours }));
  const dedans = (x) => x.valeurs.filter((v) => v <= p.jours).length;
  const tenus = liste.reduce((n, x) => n + dedans(x), 0);
  const total = liste.reduce((n, x) => n + x.valeurs.length, 0);

  $("#promesse").innerHTML = `<div class="feuillet">
    <div class="titre-fig">${esc(L.figPromesseTitre)}</div>
    ${strates({
      strates: liste,
      seuil: { v: p.jours, etiquette: L.promesseEtiq(p.jours.toFixed(1)) },
      bas: p.bornes.bas, haut: p.bornes.haut,
      fmtX: (v) => v.toFixed(0) + (Math.round(v) === 1 ? " day" : " " + L.jours),
      compte: (dedans, n) => `${partEcrite(dedans, n)} — ${nb(dedans)}/${nb(n)}`,
      aria: L.figPromesseAria,
    })}
    <div class="renvoi">${L.promesseQuoi(...[liste[0], liste[liste.length - 1]].map((x) => partEcrite(dedans(x), x.valeurs.length)), partEcrite(tenus, total))}</div>
  </div>`;

  saisir($("#promesse"), ({ x }) => {
    etat.promesse.jours = Math.min(p.bornes.haut, Math.max(p.bornes.bas, x));
    blocPromesse();
    clearTimeout(syncPromesse);
    syncPromesse = setTimeout(() => envoyer("/api/promesse", { jours: etat.promesse.jours }), 220);
  }, { x: p.jours });
}

function blocCohortes() {
  const L = t();
  $("#titreCohortes").textContent = L.titreCohortes;

  /*
   * Bars, not a table.
   *
   * The finding is that clean cases finish in 2.4 days and twice-returned cases take 21.6 —
   * a factor of nearly nine, with the headline mean sitting between them describing
   * neither. In three table rows that has to be read and divided. Drawn, the gap is the
   * first thing anybody sees, and the marker showing where the average falls makes the
   * point without a sentence.
   */
  const max = Math.max(...etat.cohorts.map((x) => x.meanLeadDays));
  const moy = etat.overall.meanLeadDays;

  const jauges = etat.cohorts.map((x) => `<div class="jauge${x.passes >= 2 ? " defavorable" : x.passes === 0 ? " gagnant" : ""}">
    <div class="etiquette">
      <b>${esc(x.label)} <small>— ${nb(x.cases)} ${esc(L.colDossiers)}, ${pc(x.share)}</small></b>
      <span class="valeur">${x.meanLeadDays.toFixed(1)} ${esc(L.jours)}</span>
    </div>
    <div class="piste">
      <div class="remplissage" style="width:${((x.meanLeadDays / max) * 100).toFixed(1)}%"></div>
      <div class="seuil" style="left:${((moy / max) * 100).toFixed(1)}%"></div>
    </div>
  </div>`).join("");

  const lignes = etat.cohorts.map((x) => `<tr${x.passes === 0 ? ' class="ici"' : ""}>
    <td>${esc(x.label)}</td><td>${nb(x.cases)}</td><td>${pc(x.share)}</td>
    <td><b>${x.meanLeadDays.toFixed(1)}</b></td><td>${x.medianLeadDays.toFixed(1)}</td>
    <td>${x.meanTouchHours.toFixed(1)} ${esc(L.heures)}</td><td>${x.timesLonger.toFixed(1)}×</td></tr>`).join("");

  $("#cohortes").innerHTML = `<div class="feuillet"><div class="corps">
    ${jauges}
    <div class="renvoi">${L.repere(moy.toFixed(1))}</div>
    <details>
      <summary>${esc(L.voirChiffres)}</summary>
      <div class="defile"><table><thead><tr>
        <th>${esc(L.colCohorte)}</th><th>${esc(L.colDossiers)}</th><th>${esc(L.colPart)}</th>
        <th>${esc(L.colMoyJours)}</th><th>${esc(L.colMedJours)}</th><th>${esc(L.colTravaille)}</th>
        <th>${esc(L.colFois)}</th></tr></thead><tbody>${lignes}</tbody></table></div>
    </details>
    <div class="suite">${L.cohortesQuoi}</div>
  </div></div>`;
}

/**
 * LA CARTE DES CHEMINS.
 *
 * « 74 routes distinctes, 40 % de conformité » est une phrase qu'on croit sur parole, et
 * le tableau des variantes l'écrit en abrégé — lisible, mais jamais visible. Dessinée, la
 * route documentée devient une ligne droite et tout le reste devient ce qu'il est : des
 * détours et deux boucles.
 *
 * La disposition se déduit du journal, elle n'est pas écrite à la main. L'épine dorsale
 * est la route documentée ; toute activité qui n'en fait pas partie se place en dessous,
 * à mi-chemin de ses voisines. Coder les positions en dur aurait lié la figure au
 * vocabulaire de ce journal-ci, et ce vocabulaire est justement ce qu'un autre journal
 * change en premier.
 *
 * Ne dessine que les huit variantes que l'écran reçoit — quatre cinquièmes des dossiers.
 * La légende le dit : une carte qui prétendrait montrer les soixante-quatorze serait une
 * pelote, et fausse par-dessus le marché.
 */
function carteDesChemins(variantes) {
  const L = t();
  const doc = variantes.find((v) => v.documented);
  if (!doc) return "";
  const epine = doc.path;

  /* Les transitions, additionnées sur les variantes reçues. */
  const arcs = new Map();
  for (const v of variantes) {
    for (let i = 0; i < v.path.length - 1; i++) {
      const cle = v.path[i] + "\u0000" + v.path[i + 1];
      arcs.set(cle, (arcs.get(cle) ?? 0) + v.cases);
    }
  }

  /* Le cadre serre le dessin : l'épine en haut, les écarts juste dessous. Quatre-vingt-dix
   * pixels de vide au-dessus faisaient flotter la carte au milieu de rien. */
  const LARGE = 760, HAUT = 196, Y = 44, H = 32;
  const pas = (LARGE - 120) / (epine.length - 1);
  const x = new Map(epine.map((a, i) => [a, 60 + i * pas]));
  const y = new Map(epine.map((a) => [a, Y]));

  /* Les activités hors épine : sous la ligne, entre leurs voisines. */
  const dehors = [...new Set(variantes.flatMap((v) => v.path))].filter((a) => !x.has(a));
  dehors.forEach((a, i) => {
    const voisines = [];
    for (const v of variantes) {
      const k = v.path.indexOf(a);
      if (k > 0 && x.has(v.path[k - 1])) voisines.push(x.get(v.path[k - 1]));
      if (k >= 0 && k < v.path.length - 1 && x.has(v.path[k + 1])) voisines.push(x.get(v.path[k + 1]));
    }
    x.set(a, voisines.length ? voisines.reduce((s, n) => s + n, 0) / voisines.length : LARGE / 2);
    y.set(a, Y + 74 + (i % 2) * 42);
  });

  const largeur = (n) => Math.max(1.2, Math.min(7, Math.sqrt(n) / 4));
  /*
   * `markerUnits="userSpaceOnUse"` : sans lui, la pointe de flèche grandit avec l'épaisseur
   * du trait, et l'arc le plus fréquent — 484 dossiers, donc le trait le plus large —
   * arrivait avec une pointe deux fois plus haute que le nœud qu'elle désignait.
   */
  let dessin = '<defs><marker id="fl" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9"'
    + ' refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="currentColor" /></marker></defs>';

  for (const [cle, n] of [...arcs].sort((a, b) => a[1] - b[1])) {
    const [de, vers] = cle.split("\u0000");
    const surEpine = y.get(de) === Y && y.get(vers) === Y && x.get(vers) > x.get(de);
    const x1 = x.get(de) + (surEpine ? 44 : 0), y1 = y.get(de) + (surEpine ? 0 : H / 2);
    const x2 = x.get(vers) - (surEpine ? 44 : 0), y2 = y.get(vers) + (surEpine ? 0 : -H / 2);
    const classe = surEpine ? "arc-epine" : (x.get(vers) <= x.get(de) ? "arc-retour" : "arc-ecart");
    /*
     * Un retour se dessine comme un retour : il ressort par le côté et revient par le bas,
     * au lieu de remonter tout droit. Une boucle qui ressemble à un trait vertical ne se
     * lit pas comme une boucle, et la boucle est ce que cette figure existe pour montrer.
     */
    if (surEpine) {
      dessin += `<line class="${classe}" x1="${x1.toFixed(0)}" y1="${y1}" x2="${x2.toFixed(0)}" y2="${y2}" stroke-width="${largeur(n)}" marker-end="url(#fl)" />`;
    } else if (classe === "arc-retour") {
      const creux = Math.max(y1, y2) + 34;
      dessin += `<path class="${classe}" d="M${x1.toFixed(0)} ${y1} C${(x1 + 46).toFixed(0)} ${creux} ${(x2 - 46).toFixed(0)} ${creux} ${x2.toFixed(0)} ${y2}" fill="none" stroke-width="${largeur(n)}" marker-end="url(#fl)" />`;
    } else {
      const mi = ((y1 + y2) / 2 + 26).toFixed(0);
      dessin += `<path class="${classe}" d="M${x1.toFixed(0)} ${y1} C${x1.toFixed(0)} ${mi} ${x2.toFixed(0)} ${mi} ${x2.toFixed(0)} ${y2}" fill="none" stroke-width="${largeur(n)}" marker-end="url(#fl)" />`;
    }
  }

  for (const [a, ax] of x) {
    const ay = y.get(a), sur = ay === Y, fin = a === epine[epine.length - 1];
    const w = Math.max(74, Math.min(120, a.length * 7.2));
    dessin += `<g class="noeud${sur ? " epine" : ""}${fin ? " fin" : ""}">`
      + `<rect x="${(ax - w / 2).toFixed(0)}" y="${ay - H / 2}" width="${w}" height="${H}" />`
      + `<text x="${ax.toFixed(0)}" y="${ay + 4}" text-anchor="middle">${esc(a)}</text></g>`;
  }

  const part = variantes.reduce((s, v) => s + v.share, 0);
  return `<figure class="graphe"><div class="defile cadre-graphe">
    <svg viewBox="0 0 ${LARGE} ${HAUT}" role="img" aria-label="${esc(L.figCarteAria)}">${dessin}</svg>
    </div><p class="legende-carte">${esc(L.figCarteLegende(pc(part)))}</p></figure>`;
}

function blocRoutes() {
  const L = t(), c = etat.conformance;
  $("#titreRoutes").textContent = L.titreRoutes;
  const lignes = etat.variants.map((v) => `<tr${v.documented ? ' class="ici"' : ""}>
    <td>${nb(v.cases)}</td><td>${pc(v.share)}</td>
    <td><code>${esc(v.short)}</code>${v.documented ? " ← " + esc(L.documente) : ""}</td></tr>`).join("");
  /* La traîne est le résultat : huit routes nommées, et soixante-six qu'on ne montre pas
   * parce qu'elles n'ont qu'un dossier chacune — mais qui, ensemble, pèsent. */
  const traine = Math.max(0, 1 - etat.variants.reduce((t, v) => t + v.share, 0));
  const figRoutes = barres({
    items: [
      ...etat.variants.map((v) => ({
        nom: v.short, valeur: v.share, ici: v.documented,
        ton: v.documented ? "accent" : undefined,
        note: nb(v.cases) + " " + L.colCas.toLowerCase(),
      })),
      ...(etat.moreVariants > 0 && traine > 0
        ? [{ nom: L.autresRoutes(etat.moreVariants), valeur: traine, ton: "attention" }] : []),
    ],
    fmt: pc, max: 1, aria: L.figRoutesAria,
  });

  $("#routes").innerHTML = `<div class="feuillet">
    <div class="quoi">${L.routesQuoi(c.distinctPaths, pc(c.share), c.pathsForFourFifths)}</div>
    <div class="titre-fig">${esc(L.figCarteTitre)}</div>${carteDesChemins(etat.variants)}
    <div class="titre-fig">${esc(L.figRoutesTitre)}</div>${figRoutes}
    <details><summary>${esc(L.voirChiffres)}</summary>
    <div class="defile"><table><thead><tr>
      <th>${esc(L.colCas)}</th><th>${esc(L.colPart)}</th><th>${esc(L.colRoute)}</th>
    </tr></thead><tbody>${lignes}</tbody></table></div></details>
    ${etat.moreVariants > 0 ? `<div class="renvoi">${esc(L.plusDeRoutes(etat.moreVariants))}</div>` : ""}
  </div>`;
}

function blocEtapes() {
  const L = t();
  $("#titreEtapes").textContent = L.titreEtapes;
  const lignes = etat.steps.map((s) => `<tr${s.perCase > 1.1 ? ' class="ici"' : ""}>
    <td>${esc(s.activity)}</td><td>${s.perCase.toFixed(2)}</td>
    <td>${s.meanPerOccurrence.toFixed(0)} min</td><td><b>${s.meanPerCase.toFixed(0)} min</b></td>
    <td>${(s.medianWaitBefore / 480).toFixed(1)} ${esc(L.jours[0])}</td></tr>`).join("");
  /* Une barre = une attente médiane ; le temps travaillé reste en note. Empiler les deux
   * donnerait une somme d'une médiane et d'une moyenne, c'est-à-dire rien. */
  const figEtapes = barres({
    items: [...etat.steps].sort((x, y) => y.medianWaitBefore - x.medianWaitBefore).map((x) => ({
      nom: x.activity, valeur: x.medianWaitBefore / JOUR_MIN, ton: "attention",
      note: L.travailleSous(x.meanPerCase.toFixed(0)),
    })),
    fmt: (v) => v.toFixed(1) + " " + L.jours,
    aria: L.figEtapesAria,
  });

  $("#etapes").innerHTML = `<div class="feuillet">
    <div class="quoi">${L.etapesQuoi}</div>
    <div class="titre-fig">${esc(L.figEtapesTitre)}</div>${figEtapes}
    <details><summary>${esc(L.voirChiffres)}</summary>
    <div class="defile"><table><thead><tr>
      <th>${esc(L.colActivite)}</th><th>${esc(L.colParDossier)}</th><th>${esc(L.colRapport)}</th>
      <th>${esc(L.colReel)}</th><th>${esc(L.colAttenteAvant)}</th>
    </tr></thead><tbody>${lignes}</tbody></table></div></details>
  </div>`;
}

function blocHypotheses() {
  const L = t();
  $("#titreHyp").textContent = L.titreHyp;
  const champs = Object.keys(etat.bounds).map((cle) => {
    const [min, max] = etat.bounds[cle];
    return `<div><label for="${cle}">${esc(L[cle])}</label>
      <input type="text" inputmode="decimal" id="${cle}" value="${etat.assumptions[cle]}" data-min="${min}" data-max="${max}" /></div>`;
  }).join("");

  const v = etat.value;
  $("#hypotheses").innerHTML = `<div class="feuillet">
    <div class="quoi">${esc(L.hypQuoi)}</div>
    <div class="grille">${champs}</div>
    <div class="ligne total"><span class="intitule">${esc(L.valeur)}</span>
      <span class="valeur">${dollars(v.total)}</span></div>
    <div class="titre-fig">${esc(L.figDelaiTitre)}</div>
    ${barres({
      items: [
        { nom: L.avecDelai, valeur: v.total, ton: "accent", ici: true },
        { nom: L.sansDelai, valeur: v.atZero, ton: "attention" },
      ],
      fmt: dollars, aria: L.figDelaiAria,
    })}
    <div class="renvoi ${v.factor > 2 ? "attention" : ""}">${L.zero(dollars(v.atZero), dollars(v.total), v.factor.toFixed(1))}</div>
    <button class="b remise" id="defaut" type="button">${esc(L.defaut)}</button>
  </div>`;

  for (const cle of Object.keys(etat.bounds)) {
    $(`#${cle}`).onchange = (e) => envoyer("/api/hypotheses", { [cle]: lire(e.target.value) });
  }
  $("#defaut").onclick = () => envoyer("/api/hypotheses", { remise: true });
}

function dessiner() {
  const L = t();
  $("#h1").textContent = L.h1;
  $("#lede").textContent = L.lede;
  $("#provenanceLegende").innerHTML = L.provenance;
  blocTete(); blocAlerte(); blocPromesse(); blocCohortes(); blocRoutes(); blocEtapes(); blocHypotheses();
}

async function envoyer(chemin, corps) {
  if (occupe) return;
  occupe = true;
  try { etat = await api(chemin, corps ?? {}); dessiner(); }
  finally { occupe = false; }
}

etat = await api("/api/etat");
dessiner();
</script>
</body>
</html>
